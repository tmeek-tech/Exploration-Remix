modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "explorationremix.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The deep layers are built from Create's stones (asurine, crimsite, ochrum, veridium, limestone, scoria, scorchia);
# without Create they fall back to vanilla blocks.
[[dependencies.${mod_id}]]
modId = "create"
mandatory = false
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"

# Optional worldgen neighbours: the deep world reads their results at server start, so they load first.
[[dependencies.${mod_id}]]
modId = "tectonic"
mandatory = false
versionRange = "[3.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "lithostitched"
mandatory = false
versionRange = "[1.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "wwoo_forge"
mandatory = false
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
